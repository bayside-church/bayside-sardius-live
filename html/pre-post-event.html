     Service times, social icons, on-demand URL, and campus switcher
     are populated dynamically by bayside-sardius.js -->

<!-- Background Video -->
<video playsinline autoplay muted loop id="baysideBgVideo"
  poster="https://storage.sardius.media/005aD180855507C/archives/97816C50eC792A6A2b841A8e1aE6/static/9a8ef3/thumbnail.png">

<div class="preMainHeader">

</div>

<div class="baysideServiceTimes" id="baysideServiceTimesContainer">
  <h2>Watch Live</h2>
  <div id="baysideServiceList">
